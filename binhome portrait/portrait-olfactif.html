<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portrait olfactif</title>
<meta name="description" content="Quelques minutes pour raconter le parfum qui n'existe pas encore.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F3EC; --card:#FFFDF9; --ink:#23262B; --muted:#6B6960; --line:#DFD9CC;
  --accent:#9A4E2F; --accent-soft:#F0E1D7; --gold:#B08A3E; --sage:#546B53; --sage-soft:#E4EBE1;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#14161A; --card:#1C1F24; --ink:#EDE8DF; --muted:#A5A197; --line:#2F343B;
  --accent:#D98A63; --accent-soft:#3A241B; --gold:#D5AE63; --sage:#8FAF8C; --sage-soft:#20291F; } }
:root[data-theme="dark"]{
  --paper:#14161A; --card:#1C1F24; --ink:#EDE8DF; --muted:#A5A197; --line:#2F343B;
  --accent:#D98A63; --accent-soft:#3A241B; --gold:#D5AE63; --sage:#8FAF8C; --sage-soft:#20291F; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 "Public Sans",system-ui,-apple-system,sans-serif;overflow-anchor:none}
#app,#app *{overflow-anchor:none}
.wrap{max-width:760px;margin:0 auto;padding:1rem 1.1rem 4rem}
header.top{display:flex;align-items:center;gap:1rem;justify-content:space-between;padding:.6rem 0 1rem;position:sticky;top:0;background:linear-gradient(var(--paper) 75%,transparent);z-index:5;padding-top:calc(.6rem + env(safe-area-inset-top,0px))}
.marque-top{font-family:"Newsreader",Georgia,serif;letter-spacing:.22em;text-transform:uppercase;font-size:.78rem;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:.4rem}
.marque-top::before{content:"←";font-family:"Public Sans",sans-serif;letter-spacing:0;color:var(--accent)}
.marque-top:hover{color:var(--accent)}
#flacon{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--muted)}
#flacon svg{width:22px;height:36px}
#flacon .glass{fill:none;stroke:var(--line);stroke-width:2}
#flacon .cap{fill:var(--line)}
#flacon .jus{fill:var(--accent);opacity:.75;transition:y .5s ease,height .5s ease}
h1{font-family:"Newsreader",Georgia,serif;font-weight:300;font-size:clamp(2.2rem,7vw,3.2rem);line-height:1.05;margin:.2rem 0 0;letter-spacing:-.02em}
h2{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:clamp(1.6rem,4.5vw,2.1rem);line-height:1.15;margin:.1rem 0 0}
h3{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:1.15rem;margin:0 0 .5rem}
.hero{padding:1rem 0 0}
.marque{font-family:"Newsreader",serif;letter-spacing:.24em;text-transform:uppercase;font-size:.8rem;color:var(--accent);margin:0}
.lead{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:300;font-size:1.15rem;color:var(--muted);margin:.6rem 0 0;max-width:56ch}
.entete{margin-bottom:1.4rem}
.chap{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 .2rem}
.steps{list-style:none;padding:0;margin:1.6rem 0 0;display:flex;flex-direction:column;gap:.7rem}
.steps li{padding-left:1.1rem;border-left:2px solid var(--accent-soft);font-size:.95rem}
.steps b{font-family:"Newsreader",serif;color:var(--accent);margin-right:.2rem}
.note{font-size:.86rem;color:var(--muted);margin:1.4rem 0 0;max-width:60ch}
.bloc .note{margin-top:.2rem}
.bloc{margin:0 0 1.6rem}
label,.lbl{display:block;font-weight:500;font-size:.98rem;margin:0 0 .45rem}
.aide{font-size:.82rem;color:var(--muted);margin:-.25rem 0 .5rem}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem}
textarea{min-height:5.5rem;resize:vertical;font-family:"Newsreader",Georgia,serif;font-size:1.05rem}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{font:inherit;font-size:.92rem;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.45rem .9rem;cursor:pointer;transition:background .15s,border-color .15s}
.chip.mini{font-size:.82rem;padding:.3rem .7rem;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#FFF9F4}
.chip.mini.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
.tile{position:relative;display:flex;flex-direction:column;gap:.4rem;padding:0 0 .6rem;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:inherit;color:inherit;text-align:left;overflow:hidden}
.tile .vis{display:grid;place-items:center;height:92px;background:linear-gradient(145deg,var(--t),color-mix(in srgb,var(--t) 62%,#000));color:#fff}
.tile .vis img{width:100%;height:100%;object-fit:cover}
.tile .em{font-size:2rem;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.tile .lab{padding:0 .6rem;font-size:.88rem;line-height:1.3}
.tile .lab em{display:block;font-style:normal;font-size:.76rem;color:var(--muted);margin-top:.15rem}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tile.off{opacity:.42}
.tile.off .lab{text-decoration:line-through}
.tile .mark{position:absolute;top:.4rem;right:.4rem;width:1.5rem;height:1.5rem;display:grid;place-items:center;border-radius:50%;font-size:.75rem;line-height:1;color:#fff}
.tile .mark.ok{background:var(--accent)} .tile .mark.no{background:rgba(0,0,0,.55)}
.tile .vis{position:relative}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:.5rem}
.card{display:flex;flex-direction:column;justify-content:space-between;gap:.5rem;padding:.6rem .6rem .5rem;background:var(--card);border:1px solid var(--line);border-radius:12px}
.card .tete{display:flex;align-items:flex-start;gap:.45rem}
.card .em{font-size:1.2rem;line-height:1.2}
.card .nom{font-size:.88rem;line-height:1.25;hyphens:auto}
.card .btns{display:flex;gap:.3rem;justify-content:flex-end}
.vote{width:2rem;height:2rem;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.85rem;line-height:1;cursor:pointer;display:grid;place-items:center}
.vote.on{color:#FFF9F4;border-color:transparent}
.vote.aime.on{background:var(--accent)}
.vote.neutre.on{background:var(--muted)}
.vote.non.on{background:var(--ink)}
.card.aime{border-color:var(--accent)}
.card.non{opacity:.5}
.curs{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:.6rem;margin-bottom:1.2rem}
.curs b{display:block;font-size:.9rem;font-weight:500}
.curs small{color:var(--muted);font-size:.76rem;line-height:1.25;display:block}
.cr{text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
.parf{border:1px solid var(--line);border-radius:12px;padding:.8rem;margin-bottom:.7rem;background:var(--card);display:flex;flex-direction:column;gap:.5rem}
.verdicts{display:flex;gap:.4rem;flex-wrap:wrap}
.case label{display:flex;gap:.6rem;align-items:flex-start;font-weight:400;font-size:.92rem}
.case input{margin-top:.25rem;accent-color:var(--accent);width:1.05rem;height:1.05rem}
.recap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:0 0 1.5rem}
.recap dl{margin:0}
.recap dt{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:.8rem}
.recap dd{margin:.15rem 0 0;font-family:"Newsreader",Georgia,serif;font-size:1.05rem}
.nav{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:1.8rem}
.btn{font:inherit;font-weight:500;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:.7rem 1.6rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.auto{font-size:.78rem;color:var(--muted)}
.lien{background:none;border:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.err{color:var(--accent);background:var(--accent-soft);padding:.6rem .85rem;border-radius:10px;font-size:.9rem;margin-top:.9rem}
@media (max-width:520px){
  .curs{grid-template-columns:1fr;gap:.2rem;text-align:left}
  .cr{text-align:left}
  .curs input[type=range]{margin:.35rem 0}
  .nav .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="marque-top" id="marque" href="index.html" title="Retour au site"></a>
    <div id="flacon"></div>
  </header>
  <main id="app"></main>
</div>
<script>
/* ============================================================
   PORTRAIT OLFACTIF — questionnaire client
   Configuration : tout ce qui se règle est ici.
   ============================================================ */
const CONFIG = {
  marque: "BINHÔME",
  titre: "Portrait olfactif",
  accroche: "Quelques minutes pour me raconter le parfum qui n'existe pas encore.",
  contact: "contact@binhome.fr",
  // Colle ici l'URL d'un service de formulaire (Formspree, Netlify, ton API…).
  // Vide = les réponses restent sur l'appareil et se téléchargent en fin de parcours.
  endpoint: "https://script.google.com/macros/s/AKfycbzbtiEqzsyHNoeHBkscOpY2dqtB5WcYqJzwHctE_tgJWf8xDUzUbRnZL8MsNkVvLG3M/exec",
  delaiCoffret: "sous 5 jours ouvrés",
  // Adresse de ta page d'accueil, pour le lien de retour en haut de page.
  accueil: "index.html"
};

/* ---------- Vignettes : remplace l'emoji par ta photo ----------
   img: "https://…/ma-photo.jpg"  ou  une image encodée en base64.  */
const SERIES = [
  { id:"lieu", titre:"Un lieu où tu aimerais être", options:[
    {id:"sousbois", label:"Un sous-bois après l'averse", desc:"terre humide, mousse, feuilles froissées", emoji:"🌲", img:"", ton:"#3F5545"},
    {id:"crique", label:"Une crique méditerranéenne", desc:"sel, pin chaud, figuier", emoji:"🌊", img:"", ton:"#41697C"},
    {id:"souk", label:"Un souk aux épices", desc:"cannelle, cumin, sacs de jute", emoji:"🫙", img:"", ton:"#8A5326"},
    {id:"biblio", label:"Une bibliothèque ancienne", desc:"papier, cuir, bois ciré", emoji:"📚", img:"", ton:"#6B4A34"},
    {id:"grange", label:"Une grange en fin d'été", desc:"foin sec, paille, soleil", emoji:"🌾", img:"", ton:"#9A7D3C"},
    {id:"ville", label:"Une ville après la pluie, la nuit", desc:"asphalte mouillé, métal froid", emoji:"🌃", img:"", ton:"#3A3E52"},
    {id:"boulangerie", label:"Une boulangerie au petit matin", desc:"pain chaud, beurre, sucre cuit", emoji:"🥐", img:"", ton:"#9C6B2E"},
    {id:"jardin", label:"Un jardin en fleurs au crépuscule", desc:"jasmin, rose, terre arrosée", emoji:"🌸", img:"", ton:"#6E5470"} ]},
  { id:"matiere", titre:"Une matière à toucher", options:[
    {id:"lin", label:"Lin froissé", desc:"sec, frais, un peu rêche", emoji:"🧺", img:"", ton:"#8C8875"},
    {id:"laine", label:"Laine douce", desc:"poudrée, cocon, tiède", emoji:"🧶", img:"", ton:"#9E8C78"},
    {id:"velours", label:"Velours", desc:"dense, profond, feutré", emoji:"🟣", img:"", ton:"#5B3A55"},
    {id:"cuir", label:"Cuir patiné", desc:"fumé, animal, usé", emoji:"🟤", img:"", ton:"#6E4527"},
    {id:"bois", label:"Bois brut", desc:"sec, résineux, poussiéreux", emoji:"🪵", img:"", ton:"#7A5C3E"},
    {id:"pierre", label:"Pierre mouillée", desc:"minérale, froide, nette", emoji:"🪨", img:"", ton:"#6B7076"} ]},
  { id:"moment", titre:"Un moment de la journée", options:[
    {id:"aube", label:"L'aube", desc:"air froid, rosée", emoji:"🌅", img:"", ton:"#7E8FA1"},
    {id:"midi", label:"Plein midi", desc:"pierre chaude, lumière crue", emoji:"☀️", img:"", ton:"#B08A2E"},
    {id:"dore", label:"Fin d'après-midi dorée", desc:"chaleur qui retombe, miel", emoji:"🌇", img:"", ton:"#A5652C"},
    {id:"nuit", label:"La nuit", desc:"velours, fumée, intime", emoji:"🌙", img:"", ton:"#333A4D"} ]},
  { id:"couleurs", titre:"Une palette de couleurs", options:[
    {id:"blancs", label:"Blancs et gris clairs", desc:"", emoji:"🤍", img:"", ton:"#9DA2A0"},
    {id:"verts", label:"Verts profonds", desc:"", emoji:"💚", img:"", ton:"#3D5A45"},
    {id:"ocres", label:"Ocres et terracotta", desc:"", emoji:"🧡", img:"", ton:"#A0562F"},
    {id:"roses", label:"Roses poudrés", desc:"", emoji:"🩷", img:"", ton:"#B08189"},
    {id:"bleus", label:"Bleus froids", desc:"", emoji:"💙", img:"", ton:"#44607F"},
    {id:"sombres", label:"Noirs et bruns", desc:"", emoji:"🖤", img:"", ton:"#453B36"} ]}
];

const CARTES = [
  ["Hespéridé", [["Zeste d'orange","🍊"],["Citron pressé","🍋"],["Pamplemousse","🍈"],["Thé Earl Grey","🫖"]]],
  ["Vert", [["Herbe coupée","🌱"],["Feuille de tomate","🍅"],["Feuille de figuier","🌿"]]],
  ["Aromatique", [["Lavande","💜"],["Menthe fraîche","🌬️"],["Romarin","🪴"]]],
  ["Fruité", [["Pêche","🍑"],["Fruits rouges","🍓"],["Poire","🍐"],["Figue mûre","🫐"]]],
  ["Floral", [["Rose","🌹"],["Jasmin","🤍"],["Fleur d'oranger","🌼"],["Lilas","🪻"],["Muguet","🔔"]]],
  ["Poudré", [["Rouge à lèvres","💄"],["Violette","🟪"],["Poudre de riz","🤲"]]],
  ["Gourmand", [["Vanille","🍨"],["Caramel","🍮"],["Pain chaud","🥖"],["Café","☕"],["Chocolat","🍫"],["Pâte d'amande","🌰"],["Miel","🍯"]]],
  ["Solaire", [["Monoï","🥥"],["Crème solaire","🏖️"]]],
  ["Épicé", [["Cannelle","🫚"],["Poivre noir","⚫"],["Clou de girofle","🌰"]]],
  ["Boisé et terreux", [["Crayon taillé","✏️"],["Bois de santal","🪵"],["Feu de bois","🔥"],["Sous-bois humide","🍄"]]],
  ["Ambré, cuir et tabac", [["Cuir","🧳"],["Encens d'église","⛪"],["Ambre chaud","🟠"],["Tabac blond","🚬"],["Rhum ambré","🥃"]]],
  ["Musqué et propre", [["Linge propre","🧺"],["Savon de Marseille","🧼"],["Crème pour bébé","🍼"],["Peau propre","🫧"]]],
  ["Marin et minéral", [["Air marin","🐚"],["Pluie sur l'asphalte","🌧️"]]]
];

const CURSEURS = [
  {id:"temperature", g:"Frais", gex:"une chemise en lin au vent", d:"Chaud", dex:"un pull en laine près du feu"},
  {id:"densite", g:"Léger", gex:"un voile", d:"Enveloppant", dex:"une couverture"},
  {id:"douceur", g:"Sec", gex:"du bois, du thé", d:"Sucré", dex:"une pâtisserie"},
  {id:"peau", g:"Propre", gex:"sortie de douche", d:"Charnel", dex:"la peau en fin de journée"},
  {id:"nature", g:"Naturel", gex:"un jardin", d:"Abstrait", dex:"une galerie d'art"},
  {id:"presence", g:"Discret", gex:"dans ma bulle", d:"Sillage", dex:"on me remarque"},
  {id:"audace", g:"Classique", gex:"rassurant", d:"Surprenant", dex:"singulier"}
];

const EMOTIONS = ["apaisé","confiant","libre","séduisant","nostalgique","énergique","protégé","audacieux","élégant","joueur","lumineux","mystérieux"];
const RAISONS = ["il tient bien","il est doux","on me fait des compliments","trop sucré","trop fort","écœurant","trop commun","il ne tient pas","il me donne mal à la tête"];

/* ============================================================
   État
   ============================================================ */
const KEY = "portrait-olfactif-v1";
const A = {};                       // réponses
let idx = 0, envoye = false, envoiErreur = "", ecranAffiche = null;
const el = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const liste = a => a.length<2 ? (a[0]||"") : a.slice(0,-1).join(", ")+" et "+a[a.length-1];
const uid = () => Math.random().toString(36).slice(2,8)+Date.now().toString(36);

const OFFRES = { decouverte:"Découverte", signature:"Signature", exclusive:"Exclusive" };
function lireURL(){
  try{
    const p=new URLSearchParams(location.search);
    const o=(p.get("offre")||"").toLowerCase();
    if(OFFRES[o] && !A.offre) A.offre=o;
    const pr=p.get("prenom"); if(pr && !A.prenom) A.prenom=pr.slice(0,40);
  }catch{}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({A, idx})); }catch{} }
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)||"null"); if(d&&d.A){ Object.assign(A,d.A); return d.idx||0; } }catch{} return 0; }
function clearSave(){ try{ localStorage.removeItem(KEY); }catch{} }

/* ============================================================
   Écrans
   ============================================================ */
const intro = () => ({ id:"intro", chapitre:0, render:()=>`
  <div class="hero">
    <p class="marque">${esc(CONFIG.marque)}</p>
    <h1>${esc(CONFIG.titre)}</h1>
    <p class="lead">${esc(CONFIG.accroche)}</p>
    <ul class="steps">
      <li><b>1.</b> Tu me racontes ton envie, en images, en souvenirs et en odeurs.</li>
      <li><b>2.</b> Je t'envoie un coffret d'exploration ${esc(CONFIG.delaiCoffret)} : quelques mouillettes à sentir et à noter.</li>
      <li><b>3.</b> Je compose tes premières versions, tu les essaies à l'aveugle.</li>
      <li><b>4.</b> On affine, puis tu baptises ton parfum.</li>
    </ul>
    <p class="note"><a class="lien" href="${esc(CONFIG.accueil)}">Revenir au site</a> · Compte une vingtaine de minutes. Tout est enregistré au fur et à mesure : tu peux t'arrêter et revenir. « Je ne sais pas » est toujours une réponse acceptée.</p>
  </div>`, valid:()=>true });

const ACCUEIL = { id:"accueil", chapitre:1, titre:"Faisons connaissance", render:()=>`
  ${champTexte("prenom","Comment tu t'appelles ?","Ton prénom")}
  ${champChoix("pour_qui","Ce parfum est pour…",[["moi","Moi"],["offrir","Une personne que je veux gâter"]])}
  ${champChoix("occasion","À quelle occasion ?",[["sansraison","Pour moi, sans raison"],["anniversaire","Un anniversaire"],["mariage","Un mariage"],["depart","Un nouveau départ"],["cadeau","Un cadeau"],["autre","Autre"]])}
  ${A.occasion==="autre" ? champTexte("occasion_autre","Raconte-moi l'occasion","Ex. la naissance de ma fille, la fin d'une thèse…") : ""}
  ${champChoix("niveau","Ton rapport au parfum aujourd'hui ?",[["decouvre","Je découvre"],["amateur","J'aime bien, sans m'y connaître"],["passionne","Je suis passionné"]])}
  ${A.offre ? `<p class="note">Formule choisie : <b>${esc(OFFRES[A.offre])}</b>. <button type="button" class="lien" data-choix="offre" data-val="">Changer</button></p>`
    : champChoix("offre","Quelle formule as-tu choisie ?",[["decouverte","Découverte"],["signature","Signature"],["exclusive","Exclusive"],["indecis","Je ne sais pas encore, on en parle"]],"Tu pourras encore en changer après notre premier échange.")}
  `, valid:()=> A.prenom && A.pour_qui && A.occasion && A.niveau && A.offre && (A.occasion!=="autre" || (A.occasion_autre||"").trim()),
  msg:()=>{ const m=[]; if(!A.offre) m.push("la formule choisie"); if(!A.prenom) m.push("ton prénom"); if(!A.pour_qui) m.push("pour qui est ce parfum"); if(!A.occasion) m.push("l'occasion"); if(A.occasion==="autre"&&!(A.occasion_autre||"").trim()) m.push("la description de l'occasion"); if(!A.niveau) m.push("ton rapport au parfum"); return "Il me manque encore "+liste(m)+"."; } };

const INSTANT = { id:"instant", chapitre:2, titre:"L'instant T", intro:"Ce que tu veux capturer, maintenant.", render:()=>`
  ${champLong("moment", tu("Si ce parfum était un moment de ta vie en ce moment, ce serait lequel ?"), "Ex. le premier café sur le balcon, la veille d'un grand départ…")}
  ${champLong("souvenir_fort","Une odeur qui t'a marqué, et pourquoi ?","Facultatif. Un lieu, une personne, une saison…")}
  ${champMulti("emotions", tu("Qu'aimerais-tu ressentir en le portant ?"), EMOTIONS.map(e=>[e,e]), 3, "3 au maximum")}
  ${champChoix("perception","Et les autres, que devraient-ils percevoir ?",[["rien","Rien, c'est pour moi"],["douceur","De la douceur"],["presence","De la présence"],["singularite","De la singularité"],["mystere","Du mystère"]])}
  ${champChoix("pourquoi","Pourquoi maintenant ?",[["changement","Un changement de vie"],["cadeau_soi","Un cadeau à moi-même"],["lasse","Je suis lassé de mon parfum"],["evenement","Un événement"],["autre2","Autre"]])}
  ${A.pourquoi==="lasse" ? champTexte("lasse_quoi","Qu'est-ce qui t'a lassé ?","Ex. trop sucré, trop commun…") : ""}
  ${champTexte("mot","Un mot pour résumer ce parfum","Ex. refuge, élan, dimanche…")}
  `, valid:()=> (A.moment||"").trim().length>2 && (A.emotions||[]).length,
  msg:()=>{ const m=[]; if((A.moment||"").trim().length<3) m.push("le moment que ce parfum doit capturer"); if(!(A.emotions||[]).length) m.push("au moins une émotion à ressentir"); return "Il me manque "+liste(m)+"."; } };

const IMAGES = { id:"images", chapitre:3, titre:"Les images", intro:"Choisis ce qui t'attire, sans réfléchir. Tu peux aussi écarter une image qui n'est pas du tout toi.",
  render:()=> SERIES.map(serie).join(""), valid:()=> SERIES.every(s=>(A["img_"+s.id]||[]).length),
  msg:()=>{ const m=SERIES.filter(s=>!(A["img_"+s.id]||[]).length).map(s=>"« "+s.titre.toLowerCase()+" »"); return "Choisis au moins une image dans "+(m.length>1?"chaque série qu'il te reste : ":"la série ")+liste(m)+"."; } };

const CARDS = { id:"cartes", chapitre:4, titre:"Le jeu des odeurs", intro:"Pour chaque odeur du quotidien : j'aime, je n'aime pas, ou rien de spécial. Va vite, c'est ton premier réflexe qui compte.",
  render:()=>`${CARTES.map(([fam,list])=>`
    <section class="bloc"><h3>${esc(fam)}</h3><div class="cards">
    ${list.map(([nom,em])=>{ const v=(A.cartes||{})[nom]||"";
      return `<div class="card ${v?esc(v):""}" data-nom="${esc(nom)}">
        <span class="tete"><span class="em">${em}</span><span class="nom">${esc(nom)}</span></span>
        <span class="btns">
          <button type="button" class="vote aime ${v==="aime"?"on":""}" data-carte="${esc(nom)}" data-v="aime" aria-label="J'aime ${esc(nom)}">♥</button>
          <button type="button" class="vote neutre ${v==="neutre"?"on":""}" data-carte="${esc(nom)}" data-v="neutre" aria-label="Indifférent à ${esc(nom)}">–</button>
          <button type="button" class="vote non ${v==="non"?"on":""}" data-carte="${esc(nom)}" data-v="non" aria-label="Je n'aime pas ${esc(nom)}">✕</button>
        </span></div>`; }).join("")}
    </div></section>`).join("")}
  ${champTexte("carte_pref","Parmi tes odeurs aimées, laquelle te parle le plus ?","Son nom")}
  ${champLong("carte_souvenir","Raconte-la en une phrase","Ce qu'elle te rappelle, où tu la sens…")}`,
  valid:()=> Object.values(A.cartes||{}).filter(v=>v==="aime").length>=3,
  msg:()=>{ const n=Object.values(A.cartes||{}).filter(v=>v==="aime").length;
    return n===0 ? "Choisis au moins 3 odeurs que tu aimes, avec le cœur ♥. C'est à partir d'elles que je construis ton parfum."
      : "Encore "+(3-n)+" odeur"+(3-n>1?"s":"")+" à marquer d'un cœur ♥ : il m'en faut 3 au minimum pour partir sur une piste."; } };

function serie(s){
  const sel=A["img_"+s.id]||[], rej=A["rej_"+s.id]||"";
  return `<section class="bloc"><h3>${esc(s.titre)}</h3><p class="aide">Un appui : j'aime. Deux appuis : pas du tout moi.</p>
  <div class="grid">${s.options.map(o=>{ const on=sel.includes(o.id), off=rej===o.id; return `
    <button type="button" class="tile ${on?"on":""} ${off?"off":""}" data-serie="${s.id}" data-opt="${o.id}" style="--t:${o.ton}" aria-pressed="${on}">
      <span class="vis">${o.img?`<img src="${esc(o.img)}" alt="">`:`<span class="em">${o.emoji}</span>`}${on?`<span class="mark ok">✓</span>`:off?`<span class="mark no">✕</span>`:""}</span>
      <span class="lab">${esc(o.label)}${o.desc?`<em>${esc(o.desc)}</em>`:""}</span>
    </button>`; }).join("")}</div></section>`;
}

const CURS = { id:"curseurs", chapitre:5, titre:"Les curseurs", intro:"Place ton parfum entre les deux, à l'instinct.", render:()=>`
  ${CURSEURS.map(c=>{ const v=A["c_"+c.id]??5; return `
    <div class="curs"><div class="cl"><b>${esc(c.g)}</b><small>${esc(c.gex)}</small></div>
    <input type="range" min="0" max="10" step="1" value="${v}" data-curs="${c.id}" aria-label="${esc(c.g)} ou ${esc(c.d)}">
    <div class="cr"><b>${esc(c.d)}</b><small>${esc(c.dex)}</small></div></div>`; }).join("")}
  ${champChoix("tenue","Combien de temps aimerais-tu qu'il tienne ?",[["heures","Quelques heures"],["journee","La journée"],["lendemain","Jusqu'au lendemain"]])}
  ${champChoix("codes","Côté codes, ton parfum doit plutôt évoquer…",[["masculin","Plutôt masculin"],["feminin","Plutôt féminin"],["entre","Entre les deux"],["peu_importe","Peu importe, les codes ne m'intéressent pas"]])}
  <p class="note">Cette réponse ne ferme aucune porte : elle me dit seulement quels codes respecter ou bousculer.</p>
  `, valid:()=> A.tenue && A.codes,
  msg:()=>{ const m=[]; if(!A.tenue) m.push("la tenue souhaitée"); if(!A.codes) m.push("les codes à évoquer"); return "Il me manque "+liste(m)+"."; } };

const REPERES = { id:"reperes", chapitre:6, titre:"Tes repères", intro:"Les parfums que tu connais me disent beaucoup, sans que tu aies à les décrire. Je m'en inspire, je ne les copie jamais.", render:()=>`
  ${champCase("jamais","Je n'ai jamais vraiment porté de parfum")}
  ${A.jamais?"":`
    <div class="bloc"><h3>Les parfums que tu portes ou as portés</h3><p class="aide">Jusqu'à 3</p>
    ${[0,1,2].map(i=>`<div class="parf">
      <input type="text" placeholder="Marque et nom" value="${esc((A.parfums||[])[i]?.nom||"")}" data-parf="${i}" data-f="nom">
      <div class="verdicts">${[["adore","Je l'adore"],["aime","Je l'ai aimé"],["deteste","Je ne le supporte plus"]].map(([v,l])=>`
        <button type="button" class="chip ${(A.parfums||[])[i]?.verdict===v?"on":""}" data-parf="${i}" data-verdict="${v}">${l}</button>`).join("")}</div>
      <div class="chips">${RAISONS.map(r=>`<button type="button" class="chip mini ${((A.parfums||[])[i]?.raisons||[]).includes(r)?"on":""}" data-parf="${i}" data-raison="${esc(r)}">${esc(r)}</button>`).join("")}</div>
    </div>`).join("")}</div>`}
  ${champTexte("aime_autre","Un parfum que tu aimes sentir sur quelqu'un d'autre","Le nom, ou décris-le")}
  ${champTexte("deteste","Un parfum que tu détestes","Le nom, ou décris-le. C'est souvent la réponse la plus utile.")}
  `, valid:()=>true };

const USAGE = { id:"usage", chapitre:7, titre:"L'usage et la peau", intro:"Le pratique, pour que ton parfum te suive vraiment.", render:()=>`
  ${champMulti("quand","Quand le porteras-tu surtout ?",[["quotidien","Tous les jours"],["travail","Au travail"],["soiree","En soirée"],["weekend","Le week-end"],["occasions","Pour les grandes occasions"]],5)}
  ${champMulti("saisons","En quelle saison ?",[["printemps","Printemps"],["ete","Été"],["automne","Automne"],["hiver","Hiver"],["toute","Toute l'année"]],5)}
  ${(A.quand||[]).includes("travail") ? champChoix("environnement","Ton environnement de travail",[["openspace","Open space ou bureau partagé"],["public","Contact avec du public"],["exterieur","Extérieur"],["distance","Je travaille à distance"]]) : ""}
  ${champMulti("zones","Où te parfumes-tu ?",[["poignets","Poignets"],["cou","Cou"],["vetements","Vêtements"],["cheveux","Cheveux"]],4)}
  ${champChoix("reaction","As-tu déjà réagi à un parfum ou une crème parfumée ?",[["non","Non"],["oui","Oui"],["sais_pas","Je ne sais pas"]],"Question facultative, posée uniquement pour ta sécurité. L'information ne sert qu'à ta création.")}
  ${A.reaction==="oui" ? champTexte("reaction_quoi","Si tu t'en souviens, lequel ?","Nom du produit, ou ce que ça t'a fait") : ""}
  ${champChoix("precieuse","Envie d'une note précieuse ?",[["oui","Oui"],["non","Non"],["surprends","Surprends-moi"]],"Iris, fleur d'oranger absolue, santal… Ces matières rares font l'objet d'un supplément, que je te confirmerai avant de composer.")}
  `, valid:()=> (A.quand||[]).length && (A.saisons||[]).length && (!(A.quand||[]).includes("travail") || A.environnement) };

const FIN = { id:"fin", chapitre:8, titre:"On y est", intro:"Relis ce que tu m'as dit, corrige si besoin, puis envoie-moi ton portrait.", render:()=>`
  ${champChoix("restitution","Comment veux-tu que je te raconte ton parfum ?",[["histoire","Comme une histoire : récit, images, émotions"],["creation","Comme une création : ce que j'ai construit, et pourquoi"]])}
  ${champLong("libre","Quelque chose que je n'ai pas demandé ?","Facultatif, mais souvent précieux.")}
  <div class="recap"><h3>Ce que tu m'as raconté</h3>${recap()}</div>
  ${champCase("ok_donnees","J'accepte que ces réponses soient utilisées pour créer mon parfum et me contacter à ce sujet.")}
  ${champTexte("email","Ton e-mail","Pour la suite du parcours")}
  `, valid:()=> A.restitution && A.ok_donnees && /.+@.+\..+/.test(A.email||""),
  msg:()=>{ const m=[]; if(!A.restitution) m.push("la façon dont tu veux que je te raconte ton parfum"); if(!/.+@.+\..+/.test(A.email||"")) m.push("ton e-mail"); if(!A.ok_donnees) m.push("ton accord pour que j'utilise tes réponses"); return "Il me manque "+liste(m)+"."; } };

const ECRANS_BASE = [intro(), ACCUEIL, INSTANT, IMAGES, CARDS, CURS, REPERES, USAGE, FIN];
function ecrans(){ return ECRANS_BASE; }

function tu(txt){ return A.pour_qui==="offrir" ? txt.replace(/tu /g,"cette personne ").replace(/ton /g,"son ").replace(/te /g,"lui ") : txt; }

/* ============================================================
   Champs
   ============================================================ */
function champTexte(id,label,ph){ return `<div class="bloc"><label for="f_${id}">${esc(label)}</label><input id="f_${id}" type="text" data-champ="${id}" value="${esc(A[id]||"")}" placeholder="${esc(ph||"")}"></div>`; }
function champLong(id,label,ph){ return `<div class="bloc"><label for="f_${id}">${esc(label)}</label><textarea id="f_${id}" data-champ="${id}" placeholder="${esc(ph||"")}">${esc(A[id]||"")}</textarea></div>`; }
function champChoix(id,label,opts,aide){ return `<div class="bloc"><p class="lbl">${esc(label)}</p>${aide?`<p class="aide">${esc(aide)}</p>`:""}
  <div class="chips">${opts.map(([v,l])=>`<button type="button" class="chip ${A[id]===v?"on":""}" data-choix="${id}" data-val="${v}">${esc(l)}</button>`).join("")}</div></div>`; }
function champMulti(id,label,opts,max,aide){ const sel=A[id]||[]; return `<div class="bloc"><p class="lbl">${esc(label)}</p>${aide?`<p class="aide">${esc(aide)}</p>`:""}
  <div class="chips">${opts.map(([v,l])=>`<button type="button" class="chip ${sel.includes(v)?"on":""}" data-multi="${id}" data-val="${v}" data-max="${max}">${esc(l)}</button>`).join("")}</div></div>`; }
function champCase(id,label){ return `<div class="bloc case"><label><input type="checkbox" data-case="${id}" ${A[id]?"checked":""}> ${esc(label)}</label></div>`; }

/* ============================================================
   Récapitulatif
   ============================================================ */
function labelOf(opts,v){ const o=opts.find(x=>x[0]===v); return o?o[1]:v; }
function recap(){
  const c=A.cartes||{}, aim=Object.keys(c).filter(k=>c[k]==="aime"), non=Object.keys(c).filter(k=>c[k]==="non");
  const imgs=SERIES.map(s=>(A["img_"+s.id]||[]).map(id=>s.options.find(o=>o.id===id)?.label).filter(Boolean)).flat();
  const rows=[
    ["Formule", OFFRES[A.offre] || (A.offre==="indecis" ? "à définir ensemble" : "")],
    ["Le moment", A.moment],
    ["Ce que tu veux ressentir", (A.emotions||[]).join(", ")],
    ["Ton mot", A.mot],
    ["Images choisies", imgs.join(", ")],
    ["Odeurs aimées", aim.join(", ")],
    ["Odeurs rejetées", non.join(", ")],
    ["Tenue souhaitée", A.tenue],
    ["Parfum détesté", A.deteste]
  ].filter(r=>r[1]);
  return `<dl>${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
  <p class="note">Pour corriger quelque chose, reviens en arrière : tout reste modifiable jusqu'à l'envoi.</p>`;
}

/* ============================================================
   Rendu
   ============================================================ */
function render(){
  const y=window.scrollY;
  const list=ecrans(), e=list[Math.min(idx,list.length-1)];
  const n=list.length-1;
  el("#app").innerHTML = envoye ? merci() : `
    ${e.chapitre? `<div class="entete"><p class="chap">Chapitre ${e.chapitre} sur ${n}</p><h2>${esc(e.titre)}</h2>${e.intro?`<p class="lead">${esc(tu(e.intro))}</p>`:""}</div>`:""}
    <form id="form" novalidate>${e.render()}</form>
    <div class="nav">
      ${idx>0?`<button type="button" class="btn ghost" id="prev">Retour</button>`:""}
      <button type="button" class="btn" id="next">${e.id==="intro"?"Commencer":e.id==="fin"?"Envoyer mon portrait":"Continuer"}</button>
      ${e.id!=="intro"&&e.id!=="fin"?`<span class="auto">Enregistré automatiquement</span>`:""}
    </div>
    ${envoiErreur?`<p class="err">${esc(envoiErreur)}</p>`:""}`;
  flacon(e.chapitre, n);
  if(ecranAffiche !== e.id){ ecranAffiche = e.id; requestAnimationFrame(()=>window.scrollTo(0,0)); }
  else { window.scrollTo(0,y); requestAnimationFrame(()=>window.scrollTo(0,y)); }
}
function merci(){
  return `<div class="hero">
    <h2>Merci ${esc(A.prenom||"")}.</h2>
    <p class="lead">J'ai bien reçu ton portrait. Je le lis attentivement, et je te réponds sous 48 heures avec ce que j'ai compris de ton envie.</p>
    <ul class="steps">
      <li><b>Ensuite</b> — ton coffret d'exploration part ${esc(CONFIG.delaiCoffret)} : quelques mouillettes à sentir et à noter tranquillement.</li>
      <li><b>Puis</b> — je compose tes premières versions, que tu essaieras à l'aveugle.</li>
    </ul>
    <p class="note">Une question d'ici là : ${esc(CONFIG.contact)}</p>
    <p style="margin-top:1.6rem"><a class="btn" href="${esc(CONFIG.accueil)}" style="text-decoration:none">Revenir au site</a></p>
    ${CONFIG.endpoint?"":`<p class="note">Tes réponses sont enregistrées sur cet appareil. <button type="button" class="lien" id="dl">Télécharger mes réponses</button> pour me les transmettre.</p>`}
  </div>`;
}
function flacon(ch, total){
  const p = ch? ch/total : 0;
  el("#flacon").innerHTML = `<svg viewBox="0 0 40 64" aria-hidden="true">
    <rect x="15" y="2" width="10" height="8" rx="2" class="cap"/>
    <path d="M8 18 q0-6 7-7 h10 q7 1 7 7 v38 q0 6-6 6 H14 q-6 0-6-6 z" class="glass"/>
    <clipPath id="cl"><path d="M8 18 q0-6 7-7 h10 q7 1 7 7 v38 q0 6-6 6 H14 q-6 0-6-6 z"/></clipPath>
    <rect x="8" y="${62-44*p}" width="24" height="${44*p}" class="jus" clip-path="url(#cl)"/>
  </svg><span>${Math.round(p*100)} %</span>`;
}

/* ============================================================
   Interactions
   ============================================================ */
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.champ){ A[t.dataset.champ]=t.value; save(); }
  else if(t.dataset.curs){ A["c_"+t.dataset.curs]=+t.value; save(); }
  else if(t.dataset.parf!=null && t.dataset.f){ A.parfums=A.parfums||[]; A.parfums[+t.dataset.parf]={...(A.parfums[+t.dataset.parf]||{}), nom:t.value}; save(); }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.case){ A[t.dataset.case]=t.checked; save(); if(t.dataset.case==="jamais") render(); }
});
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-choix],[data-multi],[data-carte],[data-serie],[data-parf],#next,#prev,#dl");
  if(!t) return;
  if(t.id==="next") return suivant();
  if(t.id==="prev"){ idx=Math.max(0,idx-1); save(); return render(); }
  if(t.id==="dl") return telecharger();
  if(t.dataset.choix){ A[t.dataset.choix]= t.dataset.val || undefined; save(); return render(); }
  if(t.dataset.multi){ const id=t.dataset.multi, max=+t.dataset.max||99; const cur=A[id]||[];
    A[id]= cur.includes(t.dataset.val) ? cur.filter(x=>x!==t.dataset.val) : (cur.length>=max ? [...cur.slice(1), t.dataset.val] : [...cur, t.dataset.val]);
    save(); return render(); }
  if(t.dataset.serie){ const sid=t.dataset.serie, id="img_"+sid, rid="rej_"+sid, opt=t.dataset.opt;
    const cur=A[id]||[];
    if(A[rid]===opt){ A[rid]=""; }
    else if(cur.includes(opt)){ A[id]=cur.filter(x=>x!==opt); A[rid]=opt; }
    else { A[id]= cur.length>=2 ? [cur[1], opt] : [...cur, opt]; if(A[rid]===opt) A[rid]=""; }
    save(); return render(); }
  if(t.dataset.carte){ A.cartes=A.cartes||{}; const k=t.dataset.carte, v=t.dataset.v;
    A.cartes[k]= A.cartes[k]===v ? undefined : v; if(!A.cartes[k]) delete A.cartes[k];
    save(); return majCarte(k); }
  if(t.dataset.parf!=null && t.dataset.verdict){ A.parfums=A.parfums||[]; const i=+t.dataset.parf;
    A.parfums[i]={...(A.parfums[i]||{}), verdict:t.dataset.verdict}; save(); return render(); }
  if(t.dataset.parf!=null && t.dataset.raison){ A.parfums=A.parfums||[]; const i=+t.dataset.parf; const p=A.parfums[i]||{}; const r=p.raisons||[];
    p.raisons= r.includes(t.dataset.raison) ? r.filter(x=>x!==t.dataset.raison) : [...r, t.dataset.raison];
    A.parfums[i]=p; save(); return render(); }
});
function majCarte(nom){
  const v=(A.cartes||{})[nom];
  document.querySelectorAll(`[data-carte="${CSS.escape(nom)}"]`).forEach(b=>{
    b.classList.toggle("on", b.dataset.v===v);
  });
  const w=document.querySelector(`.card[data-nom="${CSS.escape(nom)}"]`);
  if(w){ w.classList.toggle("aime", v==="aime"); w.classList.toggle("non", v==="non"); w.classList.toggle("neutre", v==="neutre"); }
}
function suivant(){
  const list=ecrans(), e=list[idx];
  if(!e.valid()){ manque(); return; }
  if(e.id==="fin") return envoyer();
  idx=Math.min(idx+1, list.length-1); save(); render();
}
function manque(){
  const n=el(".nav"); if(!n) return;
  const e=ecrans()[idx];
  let p=el("#manque"); if(!p){ p=document.createElement("p"); p.id="manque"; p.className="err"; n.after(p); }
  p.textContent = (e.msg && e.msg()) || "Il manque une réponse sur cet écran pour continuer.";
  p.scrollIntoView({block:"nearest", behavior:"smooth"});
}
function payload(){
  return { id:uid(), envoye_le:new Date().toISOString(), marque:CONFIG.marque, reponses:A };
}
function telecharger(){
  const blob=new Blob([JSON.stringify(payload(),null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`portrait-${(A.prenom||"client").toLowerCase().replace(/[^a-z0-9]/g,"")}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
async function envoyer(){
  envoiErreur="";
  const data=payload();
  try{
    if(CONFIG.endpoint){
      // Google Apps Script n'accepte pas l'en-tête JSON (requête préalable bloquée) : on envoie en texte brut.
      const gs = /script\.google\.com/.test(CONFIG.endpoint);
      const corps = JSON.stringify(data);
      try{
        const r=await fetch(CONFIG.endpoint,{method:"POST",
          headers: gs ? {"Content-Type":"text/plain;charset=utf-8"} : {"Content-Type":"application/json",Accept:"application/json"},
          body:corps});
        if(!r.ok) throw new Error("http");
      }catch(err){
        // Certains navigateurs bloquent la lecture de la réponse d'Apps Script : on renvoie sans lire.
        if(!gs) throw err;
        await fetch(CONFIG.endpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:corps});
      }
    } else if(window.claude && window.claude.use){
      const db=await window.claude.use("db");
      if(db) await db.collection("portraits").doc(data.id).set(data);
    }
    envoye=true; clearSave(); render();
  }catch{
    envoiErreur="L'envoi n'a pas abouti. Réessaie dans un instant, ou télécharge tes réponses pour me les transmettre par e-mail.";
    render();
  }
}

const lienMarque=document.getElementById("marque");
lienMarque.textContent=CONFIG.marque; lienMarque.href=CONFIG.accueil;
lireURL();
idx=load(); render();

</script>
</body>
